services:
  - type: web
    name: pltr-signal-desk
    runtime: python
    region: frankfurt        # Binance and Bybit block US IPs; Render's default region is Oregon (US)
    plan: free               # deploys without a paid plan; sleeps when idle (upgrade to "starter" for always-on)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # Accounts, keys and results live in DATA_DIR. Render wipes the service's own
    # disk on every deploy, so attach a persistent disk (paid plans only) or they
    # are lost each time. Uncomment after moving to a paid plan:
    # disk:
    #   name: desk-data
    #   mountPath: /var/data
    #   sizeGB: 1
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ANTHROPIC_API_KEY   # enables the AI news/signal agent
        sync: false
      - key: AI_MODEL
        value: claude-haiku-4-5-20251001
      - key: SUPERVISOR_MODEL   # AI supervisor for the open trade
        value: claude-opus-5-5
      - key: SEC_UA             # "Your Name your@email"; SEC blocks anonymous requests
        sync: false
      - key: KEYS_SECRET        # encrypts saved exchange API keys; set once, never change (changing it makes saved keys unreadable)
        generateValue: true
      - key: SESSION_SECRET     # signs sign-in cookies
        generateValue: true
      - key: SIGNUP_CODE        # optional: friends need this code to create an account
        sync: false
      - key: DATA_DIR           # accounts, encrypted keys, trade history
        value: /var/data
      - key: X_BEARER_TOKEN      # optional: X/Twitter buzz
        sync: false
      - key: LARGE_TRADE_USD
        value: "3000"
      - key: FAST_INTERVAL
        value: "1"
      - key: DEPTH_INTERVAL
        value: "3"
      - key: STOCK_INTERVAL
        value: "30"
      - key: NEWS_INTERVAL
        value: "8"
      - key: AGENT_INTERVAL
        value: "60"
      - key: AMD_INTERVAL
        value: "60"
      - key: FILINGS_INTERVAL
        value: "1800"
      # Optional overrides if auto-discovery ever misses the symbol:
      # - key: BYBIT_SYMBOL
      #   value: PLTRXUSDT
      # - key: KRAKEN_PAIR
      #   value: PLTRXUSD
