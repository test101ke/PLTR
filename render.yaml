services:
  - type: web
    name: pltr-signal-desk
    runtime: python
    plan: free               # deploys without a paid plan; sleeps when idle (upgrade to "starter" for always-on)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ANTHROPIC_API_KEY   # enables the AI news/signal agent
        sync: false
      - key: AI_MODEL
        value: claude-3-5-haiku-latest
      - key: X_BEARER_TOKEN      # optional: X/Twitter buzz
        sync: false
      - key: LARGE_TRADE_USD
        value: "3000"
      - key: FAST_INTERVAL
        value: "1"
      - key: DEPTH_INTERVAL
        value: "3"
      - key: STOCK_INTERVAL
        value: "30"
      - key: NEWS_INTERVAL
        value: "8"
      - key: AGENT_INTERVAL
        value: "60"
      - key: AMD_INTERVAL
        value: "60"
      - key: FILINGS_INTERVAL
        value: "1800"
      # Optional overrides if auto-discovery ever misses the symbol:
      # - key: BYBIT_SYMBOL
      #   value: PLTRXUSDT
      # - key: KRAKEN_PAIR
      #   value: PLTRXUSD
